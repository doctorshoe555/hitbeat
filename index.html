<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HitBeat – Musik-Zeitleisten-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0d1a; --panel:#1a1730; --panel2:#24203f; --ink:#f4f1ff; --muted:#a59fc7;
    --accent:#ff4f8b; --accent2:#3ee0c5; --gold:#ffc94a; --bad:#ff6b5b; --good:#3ee08a;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:
    radial-gradient(700px 400px at 100% -10%, rgba(255,79,139,.18), transparent 60%),
    radial-gradient(600px 400px at -10% 110%, rgba(62,224,197,.14), transparent 60%), var(--bg)}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
  h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
  h1 span{color:var(--accent)}
  h2{font-size:22px;font-weight:700;margin-bottom:10px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .panel{background:var(--panel);border-radius:var(--radius);padding:16px;margin-top:14px;border:1px solid rgba(255,255,255,.06)}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input[type=text],input[type=number],select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:var(--panel2);color:var(--ink);font-size:16px;font-family:inherit}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .btn{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--panel2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;margin-top:10px;transition:transform .08s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.spotify{background:#1ed760;color:#06210f;font-size:18px;padding:18px}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--muted)}
  .btn.small{padding:9px 12px;font-size:14px;width:auto;margin-top:0}
  .btn:disabled{opacity:.4;pointer-events:none}
  .seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:9px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--accent2);color:#06211d}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:12px}
  .chip{flex:0 0 auto;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap}
  .chip.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .chip b{font-weight:600}
  .tok{color:var(--gold)}
  .turnbox{text-align:center}
  .big{font-family:"Bricolage Grotesque";font-size:34px;font-weight:800;line-height:1.05}
  .dj{display:inline-block;background:rgba(62,224,197,.14);color:var(--accent2);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;margin-top:10px}
  .hint{color:var(--muted);font-size:14px;line-height:1.45;margin-top:10px}
  .vinyl{width:120px;height:120px;margin:16px auto 4px;border-radius:50%;background:
    radial-gradient(circle,var(--accent) 0 14%,#111 15% 17%,#1c1c1c 18% 30%,#111 31% 32%,#1c1c1c 33% 46%,#111 47% 48%,#1c1c1c 49% 62%,#111 63% 64%,#1c1c1c 65%);animation:spin 3s linear infinite;box-shadow:0 10px 40px rgba(255,79,139,.25)}
  .vinyl.stop{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}
  .timeline{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-top:10px}
  .card{background:linear-gradient(160deg,#2c2752,#201c3b);border-radius:12px;padding:8px 10px;min-width:84px;max-width:140px;flex:0 0 auto;border:1px solid rgba(255,255,255,.08)}
  .card .y{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;color:var(--gold)}
  .card .t{font-size:11.5px;line-height:1.25;color:var(--ink);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .a{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .card.new{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset}
  .slot{flex:0 0 auto;width:40px;border-radius:12px;border:2px dashed rgba(255,255,255,.18);background:transparent;color:var(--muted);font-size:20px;cursor:pointer;min-height:64px;font-family:inherit}
  .slot.sel{border-style:solid;border-color:var(--accent);background:rgba(255,79,139,.18);color:#fff}
  .slot.ch{border-style:solid;border-color:var(--gold);background:rgba(255,201,74,.16);color:#fff}
  .slot.both{border-color:var(--accent)}
  .result{text-align:center;padding:6px 0}
  .result .year{font-family:"Bricolage Grotesque";font-size:64px;font-weight:800;color:var(--gold);line-height:1}
  .result .title{font-size:20px;font-weight:600;margin-top:6px}
  .result .artist{color:var(--muted)}
  .verdict{margin-top:14px;padding:12px;border-radius:12px;font-weight:600}
  .verdict.ok{background:rgba(62,224,138,.14);color:var(--good)}
  .verdict.no{background:rgba(255,107,91,.14);color:var(--bad)}
  .verdict.neutral{background:var(--panel2);color:var(--ink)}
  .toggle{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer;user-select:none}
  .toggle .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800}
  .toggle.on .box{background:var(--good);border-color:var(--good);color:#062}
  .players .prow{display:flex;gap:8px;margin-top:8px}
  .players .prow input{flex:1}
  .x{width:46px;flex:0 0 46px;border-radius:12px;border:0;background:var(--panel2);color:var(--muted);font-size:18px;cursor:pointer}
  .modal-bg{position:fixed;inset:0;background:rgba(5,4,12,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .modal{background:var(--panel);border-radius:20px 20px 0 0;padding:20px 16px 28px;width:100%;max-width:720px;max-height:85vh;overflow:auto}
  .rules p,.rules li{color:var(--muted);font-size:14px;line-height:1.5}
  .rules b{color:var(--ink)}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .linkish{background:none;border:0;color:var(--muted);font-family:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
  .confetti{font-size:54px;text-align:center}
  .small{font-size:12.5px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2c2752;color:var(--ink);padding:12px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
  .ok-badge{display:inline-block;background:rgba(30,215,96,.15);color:#1ed760;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
  code.uri{display:block;background:var(--panel2);padding:10px 12px;border-radius:10px;font-size:13px;word-break:break-all;margin-top:6px;color:var(--accent2)}
  .dev{display:flex;justify-content:space-between;align-items:center}
</style>
</head>

const SONGS = RAW.trim().split("\n").map((l,i)=>{const [t,a,y,f]=l.split("|");return {id:i,title:t,artist:a,year:+y,de:f==="d"};});

const KEY="hitbeat-v1";
let S = load() || fresh();
function fresh(){return {phase:"setup",names:["",""],target:10,mode:"normal",pool:"all",startTokens:2,yearGuess:true,mcGuess:true,players:[],cur:0,deck:[],song:null,slot:null,ch:null,guessed:false,opened:false,log:null};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.phase?s:null;}catch(e){return null;}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const song=id=>SONGS[id];
const sorted=tl=>tl.slice().sort((x,y)=>song(x).year-song(y).year||x-y);
const P=()=>S.players[S.cur];
const djIndex=()=>S.players.length<2?S.cur:(S.cur-1+S.players.length)%S.players.length;
const MAXTOK=5;

function slotOk(tl,slot,y){const s=sorted(tl).map(id=>song(id).year);return (slot===0||s[slot-1]<=y)&&(slot===s.length||y<=s[slot]);}
function draw(){if(!S.deck.length){S.deck=shuffle(poolIds().filter(id=>!S.players.some(p=>p.timeline.includes(id))));}return S.deck.pop();}
function poolIds(){return SONGS.filter(s=>S.pool==="all"||(S.pool==="de"?s.de:!s.de)).map(s=>s.id);}

// ---------- Spotify (PKCE + Web API, steuert ein Spotify-Connect-Gerät) ----------
const LS={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const REDIRECT=location.origin+location.pathname;
const SCOPES="user-read-playback-state user-modify-playback-state streaming user-read-email user-read-private";
const SP={
  get cid(){return LS.get("hb-cid")||"ef5b4a8591514b889f1827ebafa80be4";},
  get tok(){return LS.get("hb-tok");},
  get connected(){return !!(this.tok&&this.tok.refresh);},
  get device(){return LS.get("hb-dev");},
  get startAt(){const v=LS.get("hb-start");return v===null?-1:v;},
};
function toast(msg,ms=3500){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function randStr(n){const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";const a=crypto.getRandomValues(new Uint8Array(n));return Array.from(a,x=>c[x%c.length]).join("");}

async function spLogin(){
  const cid=(document.getElementById("cid")?.value||SP.cid).trim();
  if(!cid){toast("Bitte zuerst die Client ID eintragen.");return;}
  LS.set("hb-cid",cid);
  const verifier=randStr(64), state=randStr(16);
  LS.set("hb-pkce",{verifier,state});
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  const p=new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:challenge,state});
  location.href="https://accounts.spotify.com/authorize?"+p;
}
async function tokenRequest(params){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(params)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"Token-Fehler");
  const old=SP.tok||{};
  LS.set("hb-tok",{access:j.access_token,refresh:j.refresh_token||old.refresh,scope:j.scope||old.scope||"",exp:Date.now()+(j.expires_in-60)*1000});
}
async function spCallback(){
  const q=new URLSearchParams(location.search);
  if(!q.has("code")&&!q.has("error")) return;
  history.replaceState(null,"",location.pathname);
  if(q.has("error")){toast("Spotify-Anmeldung abgebrochen: "+q.get("error"));return;}
  const pk=LS.get("hb-pkce");
  if(!pk||pk.state!==q.get("state")){toast("Anmeldung ungültig, bitte erneut verbinden.");return;}
  try{await tokenRequest({grant_type:"authorization_code",code:q.get("code"),redirect_uri:REDIRECT,client_id:SP.cid,code_verifier:pk.verifier});LS.del("hb-pkce");toast("✅ Mit Spotify verbunden");}
  catch(e){toast("Anmeldung fehlgeschlagen: "+e.message,6000);}
}
async function accessToken(){
  const t=SP.tok; if(!t) throw new Error("Nicht verbunden");
  if(Date.now()>t.exp) await tokenRequest({grant_type:"refresh_token",refresh_token:t.refresh,client_id:SP.cid});
  return SP.tok.access;
}
async function api(method,path,body,retry=true){
  const r=await fetch("https://api.spotify.com/v1"+path,{method,headers:{Authorization:"Bearer "+await accessToken(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry){const t=SP.tok;t.exp=0;LS.set("hb-tok",t);return api(method,path,body,false);}
  return r;
}
function spLogout(){LS.del("hb-tok");LS.del("hb-dev");render();}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
async function findUri(s){
  const cache=LS.get("hb-uris")||{}; const key=s.title+"|"+s.artist;
  if(cache[key]) return typeof cache[key]==="string"?{uri:cache[key],dur:0}:cache[key];
  const main=s.artist.split(/ ft\.| feat\.| & /i)[0];
  const tries=[`track:${s.title} artist:${main}`,`${s.title} ${main}`];
  for(const q of tries){
    const r=await api("GET","/search?"+new URLSearchParams({q,type:"track",limit:"10",market:"DE"}));
    if(!r.ok) continue;
    const items=((await r.json()).tracks||{}).items||[];
    const nt=norm(s.title), na=norm(main);
    const good=items.filter(t=>t.artists.some(a=>norm(a.name).includes(na)||na.includes(norm(a.name))));
    // Bevorzugt Versionen ohne "Live", "Remix", "Karaoke" usw.
    const bad=/live|remix|karaoke|instrumental|cover|tribute|acoustic|re-record|edit\)/i;
    const pick=good.find(t=>norm(t.name).startsWith(nt)&&!bad.test(t.name))||good.find(t=>!bad.test(t.name))||good[0];
    if(pick){cache[key]={uri:pick.uri,dur:pick.duration_ms||0};LS.set("hb-uris",cache);return cache[key];}
  }
  return null;
}
// ---- Wiedergabe direkt in diesem Browser (Spotify Web Playback SDK) ----
let webPlayer=null, webDeviceId=null, sdkPromise=null;
const WEB={id:"web",name:"Dieses Gerät (Browser)"};
function loadSdk(){
  if(window.Spotify) return Promise.resolve();
  if(sdkPromise) return sdkPromise;
  sdkPromise=new Promise((res,rej)=>{
    window.onSpotifyWebPlaybackSDKReady=()=>res();
    const s=document.createElement("script"); s.src="https://sdk.scdn.co/spotify-player.js";
    s.onerror=()=>{sdkPromise=null;rej(new Error("Spotify-Player konnte nicht geladen werden"));};
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error("Zeitüberschreitung beim Laden des Players")),15000);
  });
  return sdkPromise;
}
async function initWebPlayer(){
  if(webDeviceId) return webDeviceId;
  if(!(SP.tok.scope||"").includes("streaming")) throw new Error("RECONNECT");
  await loadSdk();
  if(!webPlayer) webPlayer=new Spotify.Player({name:"HitBeat",getOAuthToken:cb=>accessToken().then(cb).catch(()=>{}),volume:0.9});
  return new Promise((res,rej)=>{
    webPlayer.addListener("ready",({device_id})=>{webDeviceId=device_id;res(device_id);});
    webPlayer.addListener("not_ready",()=>{webDeviceId=null;});
    webPlayer.addListener("initialization_error",({message})=>rej(new Error("UNSUPPORTED:"+message)));
    webPlayer.addListener("authentication_error",()=>rej(new Error("RECONNECT")));
    webPlayer.addListener("account_error",()=>rej(new Error("Für die Wiedergabe im Browser ist Spotify Premium nötig.")));
    webPlayer.addListener("player_state_changed",st=>{if(!st)return;const pl=!st.paused;if(pl!==S.playing){S.playing=pl;render();}});
    webPlayer.connect().then(ok=>{if(!ok)rej(new Error("Player-Verbindung fehlgeschlagen"));});
    setTimeout(()=>rej(new Error("Zeitüberschreitung beim Start des Players")),15000);
  });
}
function webError(e){
  if(e.message==="RECONNECT"){modal(`<h2>Neu verbinden</h2><p class="hint">Für die Wiedergabe auf diesem Gerät braucht HitBeat zusätzliche Rechte von Spotify. Einmal neu verbinden, dann klappt es.</p><button class="btn spotify" onclick="spLogin()">Neu mit Spotify verbinden</button><button class="btn ghost" onclick="closeModal()">Später</button>`);return;}
  if(e.message.startsWith("UNSUPPORTED")){modal(`<h2>Browser nicht unterstützt</h2><p class="hint">Dieser Browser kann Spotify nicht direkt abspielen. Das betrifft vor allem Safari auf dem iPhone. Alternativ kannst du die <b>Spotify-App auf diesem Handy</b> als Gerät wählen. Dann zeigt Spotify allerdings Titel auf dem Sperrbildschirm an.</p><button class="btn" onclick="chooseDevice()">Anderes Gerät wählen</button><button class="btn ghost" onclick="closeModal()">Schließen</button>`);return;}
  toast(e.message,6000);
}
async function getDevices(){const r=await api("GET","/me/player/devices");if(!r.ok) return [];return (await r.json()).devices||[];}
async function chooseDevice(){
  modal(`<h2>Wiedergabegerät</h2><p class="sub">Lädt…</p>`);
  let devs=[];try{devs=await getDevices();}catch(e){}
  modal(`<h2>Wiedergabegerät</h2>
   <button class="btn ${SP.device&&SP.device.id==="web"?"primary":""}" onclick='setDevice(${JSON.stringify(WEB)})'><span class="dev" style="width:100%"><span>📱 Dieses Gerät</span><span class="small">Browser</span></span></button>
   <div class="small" style="margin:4px 0 8px">Spielt direkt hier in HitBeat ab, ohne Spotify-App. Klappt am PC, Mac und auf Android-Chrome, nicht auf dem iPhone (auch nicht in Chrome).</div>
   ${devs.filter(d=>d.id!==webDeviceId).length?devs.filter(d=>d.id!==webDeviceId).map(d=>`<button class="btn ${SP.device&&SP.device.id===d.id?"primary":""}" onclick='setDevice(${JSON.stringify({id:d.id,name:d.name}).replace(/'/g,"&#39;")})'><span class="dev" style="width:100%"><span>${esc(d.name)}</span><span class="small">${esc(d.type)}</span></span></button>`).join("")
   :`<p class="hint">Kein weiteres Gerät gefunden. Öffne die <b>Spotify-App</b> auf dem Handy, Lautsprecher oder PC, spiel kurz irgendetwas ab und tippe dann auf Aktualisieren.</p>`}
   <button class="btn ghost" onclick="chooseDevice()">↻ Aktualisieren</button>
   <button class="btn ghost" onclick="closeModal()">Schließen</button>`);
}
function setDevice(d){LS.set("hb-dev",d);closeModal();render();toast("Gerät: "+d.name);}
let busy=false;
async function spPlay(){
  if(busy) return; busy=true;
  try{
    if(!SP.device){busy=false;chooseDevice();return;}
    if(SP.device.id==="web"&&webPlayer&&webPlayer.activateElement) webPlayer.activateElement();
    const s=song(S.song);
    const tr=await findUri(s);
    if(!tr){toast("Song nicht auf Spotify gefunden, nächster Song kommt.");S.song=draw();S.opened=false;save();busy=false;return spPlay();}
    let devId=SP.device.id;
    if(devId==="web"){try{devId=await initWebPlayer();}catch(e){busy=false;webError(e);return;}}
    let r=await api("PUT","/me/player/play?device_id="+encodeURIComponent(devId),{uris:[tr.uri],position_ms:startPos(tr)});
    if(r.status===404&&SP.device.id==="web"){webDeviceId=null;try{devId=await initWebPlayer();r=await api("PUT","/me/player/play?device_id="+encodeURIComponent(devId),{uris:[tr.uri],position_ms:startPos(tr)});}catch(e){busy=false;webError(e);return;}}
    if(r.status===404){toast("Gerät nicht erreichbar. Öffne Spotify dort und wähle es neu.",5000);LS.del("hb-dev");busy=false;chooseDevice();return;}
    if(r.status===403){toast("Spotify verweigert die Wiedergabe (Premium nötig oder Funktion eingeschränkt).",6000);}
    else if(!r.ok){const j=await r.json().catch(()=>({}));toast("Fehler beim Abspielen: "+((j.error&&j.error.message)||r.status),6000);}
    else {S.opened=true;S.playing=true;save();render();bzOpened();}
  }catch(e){toast("Fehler: "+e.message,6000);}
  busy=false;
}
function startPos(tr){
  if(SP.startAt!==-1) return SP.startAt;
  const d=tr.dur||200000; // Zufällig zwischen 25 % und 65 % der Songlänge
  return Math.floor(d*(0.25+Math.random()*0.4));
}
async function spResume(){if(SP.device&&SP.device.id==="web"&&webPlayer&&webDeviceId){await webPlayer.resume();S.playing=true;render();return;}try{const r=await api("PUT","/me/player/play"+(SP.device?"?device_id="+encodeURIComponent(SP.device.id):""));if(r.ok||r.status===204){S.playing=true;render();}else spPlay();}catch(e){toast("Fehler: "+e.message);}}
async function spPause(){if(SP.device&&SP.device.id==="web"&&webPlayer){await webPlayer.pause();S.playing=false;render();return;}try{await api("PUT","/me/player/pause"+(SP.device?"?device_id="+encodeURIComponent(SP.device.id):""));S.playing=false;render();}catch(e){toast("Fehler: "+e.message);}}

// ---------- Buzzer-Modus: mehrere Handys, verbunden über PeerJS ----------
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&(src.includes("peerjs")?window.Peer:window.QRCode))return res();const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("Konnte nicht geladen werden: "+src));document.head.appendChild(s);});}
const PEERJS="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
const QRJS="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
const PREFIX="hitbeat-room-";
let hostPeer=null, hostOnline=false; const conns={};
function roomCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from(crypto.getRandomValues(new Uint8Array(4)),x=>c[x%c.length]).join("");}
const joinUrl=()=>location.origin+location.pathname+"#join-"+S.room;
const isBz=()=>S.game==="buzzer";

async function hostStart(){
  if(hostPeer) return;
  try{await loadScript(PEERJS);}catch(e){toast(e.message,6000);return;}
  hostPeer=new Peer(PREFIX+S.room);
  hostPeer.on("open",()=>{hostOnline=true;render();});
  hostPeer.on("connection",c=>{
    c.on("data",d=>onHostMsg(c,d));
    c.on("close",()=>{if(c.hbName&&conns[c.hbName]===c)delete conns[c.hbName];render();});
  });
  hostPeer.on("disconnected",()=>{hostOnline=false;render();try{hostPeer.reconnect();}catch(e){}});
  hostPeer.on("error",e=>{
    if(e.type==="unavailable-id"){try{hostPeer.destroy();}catch(x){}hostPeer=null;hostOnline=false;setTimeout(hostStart,4000);}
    else if(e.type!=="peer-unavailable"){toast("Verbindungsproblem: "+e.type,5000);}
  });
}
function hostStop(){if(hostPeer){try{hostPeer.destroy();}catch(e){}}hostPeer=null;hostOnline=false;for(const k in conns)delete conns[k];}
function send(name,msg){const c=conns[name];if(c&&c.open){try{c.send(msg);}catch(e){}}}
function broadcast(msg){for(const n in conns)send(n,msg);}
function scores(){return S.players.map(p=>({name:p.name,cards:p.timeline.length,tokens:p.tokens}));}
function pushScores(){broadcast({t:"scores",players:scores(),target:S.target});}
function onHostMsg(c,d){
  if(!d||typeof d!=="object") return;
  if(d.t==="join"){
    const name=String(d.name||"").trim().slice(0,20); if(!name) return;
    let p=S.players.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!p){p={name,tokens:S.startTokens,timeline:[]};if(S.phase!=="bz-lobby")p.timeline.push(draw());S.players.push(p);toast("👋 "+name+" ist beigetreten");}
    conns[p.name]=c; c.hbName=p.name;
    send(p.name,{t:"welcome",you:p.name,room:S.room});
    pushScores(); syncClient(p.name); save(); render();
  } else if(d.t==="buzz"){ bzBuzz(c.hbName); }
  else if(d.t==="submit"){ const p=S.players[S.cur]; if(S.phase==="bz-answer"&&p&&p.name===c.hbName) bzEvaluate(d); }
}
function answerMsg(){
  const p=S.players[S.cur];
  if(S.mcGuess!==false&&!S.mc) makeMC();
  const info=id=>{const s=song(id);return {id,t:s.title,a:s.artist,y:s.year};};
  return {t:"answer",tl:sorted(p.timeline).map(info),mc:S.mcGuess!==false?S.mc.map(id=>{const o=info(id);delete o.y;return o;}):null,yg:S.yearGuess!==false,pro:S.mode==="pro"};
}
function syncClient(name){
  if(!conns[name]) return;
  const tried=(S.tried||[]).includes(name);
  if(S.phase==="bz-lobby") send(name,{t:"wait",text:"Warte, bis der Spielleiter startet …"});
  else if(S.phase==="bz-listen") send(name,!S.opened?{t:"wait",text:"Gleich kommt der nächste Song …"}:tried?{t:"tried"}:{t:"open"});
  else if(S.phase==="bz-answer"){const p=S.players[S.cur];send(name,p.name===name?answerMsg():{t:"locked",name:p.name});}
  else if(S.phase==="bz-reveal") send(name,revealMsg());
  else if(S.phase==="win") send(name,{t:"win",name:S.players[S.winner].name});
  else send(name,{t:"wait",text:"Spielleiter ist im Menü …"});
}
function syncAll(){S.players.forEach(p=>syncClient(p.name));}
function revealMsg(){const r=S.bzResult,s=song(r.song);return {t:"reveal",title:s.title,artist:s.artist,year:s.year,winner:r.winner,ok:r.ok,gain:r.gain||0};}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.12;o.start();o.stop(a.currentTime+.25);}catch(e){}}

function bzCreate(){
  if(!/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)){modal(`<h2>Nur in der GitHub-Version</h2><p class="hint">Der Buzzer-Modus braucht eine Verbindung zwischen den Handys. Die funktioniert nur unter <a href="https://doctorshoe555.github.io/hitbeat/" style="color:var(--accent2)">doctorshoe555.github.io/hitbeat</a>.</p><button class="btn primary" onclick="closeModal()">OK</button>`);return;}
  hostStop();
  S.game="buzzer"; S.saveId=null; S.prevPhase=null; S.room=roomCode();
  S.deck=shuffle(poolIds()); S.tried=[]; S.bzResult=null;
  S.players=S.names.map(n=>n.trim()).filter(Boolean).map(n=>({name:n,tokens:S.startTokens,timeline:[],local:true}));
  S.phase="bz-lobby"; save(); hostStart(); render();
}
function bzBegin(){
  S.players.forEach(p=>{if(!p.timeline.length)p.timeline.push(draw());});
  bzNewSong(); pushScores();
}
function bzNewSong(){
  S.song=draw(); S.tried=[]; S.mc=null; S.mcPick=null; S.yearTip=""; S.slot=null; S.ch=null;
  S.opened=false; S.playing=false; S.hostAnswer=false; S.bzResult=null; S.phase="bz-listen";
  save(); syncAll(); render(); window.scrollTo(0,0);
}
function bzOpened(){ if(isBz()&&S.phase==="bz-listen"){ save(); syncAll(); } }
function bzSkip(){ S.song=draw(); S.opened=false; S.playing=false; S.mc=null; save(); syncAll(); render(); }
function bzBuzz(name){
  if(S.phase!=="bz-listen"||!S.opened) return;
  const i=S.players.findIndex(p=>p.name===name);
  if(i<0||S.tried.includes(name)) return;
  S.cur=i; S.slot=null; S.mcPick=null; S.yearTip=""; S.hostAnswer=false; S.phase="bz-answer";
  if(SP.connected&&S.playing) spPause();
  beep(); save(); syncAll(); render();
}
function bzBuzzIdx(i){bzBuzz(S.players[i].name);}
function bzEvaluate(d){
  const p=S.players[S.cur], s=song(S.song);
  S.slot=+d.slot; S.mcPick=d.mcPick==null?null:+d.mcPick; S.yearTip=d.yearTip||""; S.hostAnswer=false;
  const placeOk=slotOk(p.timeline,S.slot,s.year);
  const guessed=S.mcGuess!==false&&S.mcPick===S.song;
  if(placeOk&&(S.mode==="normal"||guessed)){
    const tip=parseInt(S.yearTip,10), diff=isNaN(tip)?null:Math.abs(tip-s.year);
    const gain=(guessed?1:0)+(diff===0?2:diff===1?1:0);
    p.tokens=Math.min(MAXTOK,p.tokens+gain); p.timeline.push(S.song);
    S.bzResult={song:S.song,winner:p.name,ok:true,guessed,diff,gain};
    return bzFinish();
  }
  const penalty=p.tokens>0; if(penalty) p.tokens--;
  S.tried.push(p.name);
  const left=S.players.filter(q=>!S.tried.includes(q.name));
  if(!left.length){S.bzResult={song:S.song,winner:null,ok:false};return bzFinish();}
  toast(`❌ ${p.name} lag falsch${penalty?" (−1 Token)":""}. Buzzer ist wieder offen!`,4000);
  broadcast({t:"wrong",name:p.name,penalty});
  S.phase="bz-listen"; S.slot=null; S.mcPick=null; S.yearTip="";
  if(SP.connected&&S.opened) spResume();
  pushScores(); save(); syncAll(); render();
}
function bzGiveUp(){S.bzResult={song:S.song,winner:null,ok:false};bzFinish();}
function bzFinish(){
  S.phase="bz-reveal"; pushScores(); save(); syncAll(); render();
}
function bzNext(){
  const w=S.players.findIndex(q=>q.timeline.length>=S.target);
  if(w>=0){S.winner=w;S.phase="win";save();syncAll();render();return;}
  bzNewSong();
}
function bzLocalSubmit(){bzEvaluate({slot:S.slot,mcPick:S.mcPick,yearTip:S.yearTip});}
function newSetup(){hostStop();const n=S.players.filter(p=>p.local!==false&&!isBz()).map(p=>p.name);S=fresh();if(n.length)S.names=n;render();}

function postRender(){
  const q=document.getElementById("qr");
  if(q&&!q.hasChildNodes()){
    if(window.QRCode){try{new QRCode(q,{text:joinUrl(),width:180,height:180});}catch(e){}}
    else loadScript(QRJS).then(()=>{const q2=document.getElementById("qr");if(q2&&!q2.hasChildNodes())new QRCode(q2,{text:joinUrl(),width:180,height:180});}).catch(()=>{});

// ---------- Mitspieler-Ansicht (#join-CODE) ----------
const JOIN=(location.hash.match(/^#join-([A-Z0-9]{4})$/i)||[])[1];
let C={code:JOIN?JOIN.toUpperCase():"",name:LS.get("hb-name")||"",status:"name",view:{k:"wait",text:""},players:[],target:0,me:""};
let cpeer=null, cconn=null, retryT=null;
async function clientJoin(){
  const inp=document.getElementById("myName"); if(inp) C.name=inp.value.trim().slice(0,20);
  if(!C.name){toast("Bitte einen Namen eingeben");return;}
  LS.set("hb-name",C.name); C.status="connecting"; renderC();
  try{await loadScript(PEERJS);}catch(e){C.status="error";C.err=e.message;renderC();return;}
  clientConnect();
}
function clientConnect(){
  clearTimeout(retryT);
  try{if(cpeer)cpeer.destroy();}catch(e){}
  cpeer=new Peer();
  cpeer.on("open",()=>{
    cconn=cpeer.connect(PREFIX+C.code,{reliable:true});
    cconn.on("open",()=>{C.status="connected";cconn.send({t:"join",name:C.name});renderC();});
    cconn.on("data",onClientMsg);
    cconn.on("close",()=>{C.status="reconnecting";renderC();retryT=setTimeout(clientConnect,3000);});
  });
  cpeer.on("error",e=>{
    C.status=e.type==="peer-unavailable"?"nohost":"reconnecting"; renderC();
    retryT=setTimeout(clientConnect,4000);
  });
}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function onClientMsg(d){
  if(!d||typeof d!=="object")return;
  switch(d.t){
    case "welcome": C.me=d.you; break;
    case "scores": C.players=d.players; C.target=d.target; break;
    case "wait": C.view={k:"wait",text:d.text}; break;
    case "open": C.view={k:"buzz"}; break;
    case "tried": if(C.view.k!=="wrong")C.view={k:"tried"}; break;
    case "locked": if(d.name!==C.me)C.view={k:"locked",name:d.name}; break;
    case "answer": C.view={k:"answer",tl:d.tl,mc:d.mc,yg:d.yg,pro:d.pro,slot:null,mcPick:null,yearTip:""}; vib(200); break;
    case "wrong": if(d.name===C.me)C.view={k:"wrong",penalty:d.penalty}; else toast(`❌ ${d.name} lag falsch. Buzzer ist wieder offen!`); break;
    case "reveal": C.view={k:"reveal",...d}; break;
    case "win": C.view={k:"win",name:d.name}; break;
  }
  renderC();
}
function clientBuzz(){if(cconn&&cconn.open){cconn.send({t:"buzz"});C.view={k:"buzzed"};vib(60);renderC();}}
function clientSubmit(){const v=C.view;if(v.slot==null)return;cconn&&cconn.open&&cconn.send({t:"submit",slot:v.slot,mcPick:v.mcPick,yearTip:v.yearTip});C.view={k:"submitted"};renderC();}
function cPick(i){C.view.slot=i;renderC();}
function cMc(id){C.view.mcPick=C.view.mcPick===id?null:id;renderC();}
function cTimeline(ids,interactive,slot){
  let h=`<div class="timeline">`;
  for(let i=0;i<=ids.length;i++){
    if(interactive)h+=`<button class="slot ${slot===i?"sel":""}" onclick="cPick(${i})">${slot===i?"♪":"+"}</button>`;
    if(i<ids.length){const s=ids[i];h+=`<div class="card"><div class="y">${s.y}</div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)}</div></div>`;}
  }
  return h+`</div>`;
}
function renderC(){
  const a=$("#app"), v=C.view;

  if(C.status==="name"){

  const st={connecting:"⏳ Verbinde mit dem Raum …",reconnecting:"⏳ Verbindung unterbrochen, verbinde neu …",nohost:"⏳ Raum nicht gefunden. Ist der Spielleiter online? Neuer Versuch läuft …",error:"⚠️ "+esc(C.err||"Fehler")}[C.status];
  if(st){a.innerHTML=h+`<div class="panel turnbox"><div class="hint">${st}</div><button class="btn ghost" onclick="C.status='name';renderC()">Name ändern</button></div>`;return;}
  let b="";
  if(v.k==="wait") b=`<div class="panel turnbox"><div class="vinyl stop"></div><div class="hint">${esc(v.text||"Warte …")}</div></div>`;
  else if(v.k==="buzz") b=`<div class="turnbox" style="padding:30px 0"><button onclick="clientBuzz()" style="width:240px;height:240px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e0243c 60%,#9e1026);color:#fff;font-family:'Bricolage Grotesque';font-size:44px;font-weight:800;box-shadow:0 14px 0 #6d0a1a,0 20px 50px rgba(224,36,60,.5);cursor:pointer;-webkit-user-select:none">BUZZ!</button><div class="hint" style="margin-top:28px">Erkennst du den Song? Dann drück!</div></div>`;
  else if(v.k==="buzzed") b=`<div class="panel turnbox"><div class="big">🔔</div><div class="hint">Gebuzzert! Mal sehen, ob du der Schnellste warst …</div></div>`;
  else if(v.k==="tried") b=`<div class="panel turnbox"><div class="hint">Du hast in dieser Runde schon geantwortet. Jetzt sind die anderen dran.</div></div>`;

  else if(v.k==="answer"){

    if(v.mc) b+=`<div class="panel"><h3>Welcher Song ist das?</h3><div class="small" style="margin-top:4px">${v.pro?"Im Profi-Modus nötig":"Richtig: +1 Token"}</div>${v.mc.map(o=>`<button class="btn ${v.mcPick===o.id?"primary":""}" style="flex-direction:column;align-items:flex-start;text-align:left;gap:2px" onclick="cMc(${+o.id})"><span>${esc(o.t)}</span><span class="small">${esc(o.a)}</span></button>`).join("")}</div>`;
    b+=`<div class="panel"><h3>Deine Zeitleiste</h3><div class="small" style="margin-top:4px">Tippe auf die Lücke, in die der Song gehört.</div>${cTimeline(v.tl,true,v.slot)}</div>`;
    if(v.yg) b+=`<div class="panel"><h3>Dein Jahrestipp</h3><div class="small" style="margin-top:4px">Optional. Volltreffer +2 · ±1 Jahr +1 Token</div><input type="number" inputmode="numeric" placeholder="z. B. 1985" value="${esc(v.yearTip)}" style="margin-top:8px" oninput="C.view.yearTip=this.value"></div>`;

  }
  else if(v.k==="submitted") b=`<div class="panel turnbox"><div class="hint">Antwort gesendet, gleich gibt's die Auflösung …</div></div>`;
  else if(v.k==="reveal") b=`<div class="panel result"><div class="year">${v.year}</div><div class="title">${esc(v.title)}</div><div class="artist">${esc(v.artist)}</div><div class="verdict ${v.ok?"ok":"no"}">${v.ok?(v.winner===C.me?"✅ Die Karte gehört dir!"+(v.gain?` +${v.gain} Token`:""):"✅ "+esc(v.winner)+" bekommt die Karte"):"Niemand lag richtig."}</div></div>`;
  else if(v.k==="win") b=`<div class="panel" style="text-align:center"><div class="confetti">🏆</div><div class="big">${v.name===C.me?"Du gewinnst!":esc(v.name)+" gewinnt!"}</div></div>`;
  a.innerHTML=h+b;
}

function makeMC(){
  const s=song(S.song), ids=poolIds().filter(id=>id!==S.song&&song(id).title!==s.title);

  S.mc=shuffle([S.song,...near.slice(0,3)]);
}
function mcPanel(){
  if(S.mcGuess===false) return "";

function startCh(i){S.ch={p:i,slot:null,picking:true};render();}

function reveal(){
  const p=P(), s=song(S.song);
  const placeOk=slotOk(p.timeline,S.slot,s.year);
  let chOk=false;
  if(S.ch){S.players[S.ch.p].tokens--; chOk=!placeOk&&slotOk(p.timeline,S.ch.slot,s.year);}
  if(S.mcGuess!==false) S.guessed=S.mcPick===S.song;
  const tip=parseInt(S.yearTip,10), diff=isNaN(tip)?null:Math.abs(tip-s.year);

function viewReveal(){
  const p=P(), s=song(S.song), {placeOk,chOk}=S.log;
  const keep=placeOk&&(S.mode==="normal"||S.guessed);
  const diff=S.log.diff;
  let v,cls;
  if(placeOk){ cls=keep?"ok":"neutral"; v=keep?`✅ Richtig! ${esc(p.name)} behält die Karte.`:`Position richtig, aber im Profi-Modus braucht es auch Titel + Interpret.`; if(S.ch) v+=`<br><span class="small">Herausforderung von ${esc(S.players[S.ch.p].name)} gescheitert, der Token ist weg.</span>`;}
  else if(chOk){cls="no";v=`❌ Daneben. ${esc(S.players[S.ch.p].name)} lag richtig und bekommt die Karte!`;}
  else {cls="no";v=`❌ Daneben, die Karte fliegt raus.`+(S.ch?`<br><span class="small">${esc(S.players[S.ch.p].name)} lag auch falsch.</span>`:"");}
  return `<div class="panel result">
    <div class="year">${s.year}</div>
    <div class="title">${esc(s.title)}</div>
    <div class="artist">${esc(s.artist)}</div>
    <div class="verdict ${cls}">${v}</div>
    ${S.mcGuess!==false?`<div class="verdict ${S.guessed?"ok":S.mcPick==null?"neutral":"no"}">${S.guessed?"🎵 Song richtig erkannt! +1 Token":S.mcPick==null?"Kein Song getippt":"🎵 Falscher Song getippt"}</div>`:`    <div class="toggle ${S.guessed?"on":""}" onclick="S.guessed=!S.guessed;render()">
      <div class="box">${S.guessed?"✓":""}</div>
      <div style="text-align:left"><b>${esc(p.name)}</b> hat Titel <b>und</b> Interpret genannt<div class="small">${p.tokens>=MAXTOK?"Token-Maximum erreicht":"+1 Token"}${S.mode==="pro"?" · im Profi-Modus Pflicht":""}</div></div>
    </div>`}
    ${S.yearGuess!==false?`<div class="verdict ${diff===0||diff===1?"ok":"neutral"}">${diff===null?"Kein Jahrestipp":diff===0?"🎯 Volltreffer beim Jahr! +2 Tokens":diff===1?"Fast! Nur 1 Jahr daneben. +1 Token":`Jahrestipp ${diff} Jahre daneben`}</div>`:""}
    <button class="btn primary" onclick="next()">Nächster Spieler</button>
  </div>`;
}
function next(){
  const p=P(), {placeOk,chOk}=S.log;
  let gain=(S.guessed?1:0)+(S.log.diff===0?2:S.log.diff===1?1:0);
  p.tokens=Math.min(MAXTOK,p.tokens+gain);
  if(placeOk&&(S.mode==="normal"||S.guessed)) p.timeline.push(S.song);
  else if(chOk) S.players[S.ch.p].timeline.push(S.song);
  const w=S.players.findIndex(q=>q.timeline.length>=S.target);
  if(w>=0){S.winner=w;S.phase="win";render();return;}
  S.cur=(S.cur+1)%S.players.length; newTurn(); render(); window.scrollTo(0,0);
}
function viewWin(){
  const w=S.players[S.winner];
  return `<div class="panel" style="text-align:center"><div class="confetti">🏆</div><div class="big">${esc(w.name)} gewinnt!</div><div class="sub">${w.timeline.length} Karten in der Zeitleiste</div></div>
  ${tlPanel(w,false)}
  <button class="btn primary" onclick="rematch()">Revanche, gleiche Spieler</button>
  <button class="btn ghost" onclick="newSetup()">Neues Setup</button>`;
}
function rematch(){
  if(isBz()){S.deck=shuffle(poolIds());S.players.forEach(p=>{p.timeline=[draw()];p.tokens=S.startTokens;});bzNewSong();pushScores();return;}
  S.names=S.players.map(p=>p.name);start();}

// ---------- Modals ----------
function modal(html){$("#modal").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){$("#modal").innerHTML="";}
function askReset(){modal(`<h2>Spiel abbrechen?</h2><p class="sub">Der aktuelle Spielstand geht verloren.</p><button class="btn primary" onclick="const n=S.players.map(p=>p.name);S=fresh();S.names=n.length?n:['',''];closeModal();render()">Ja, neues Spiel</button><button class="btn ghost" onclick="closeModal()">Weiterspielen</button>`);}
function showRules(){modal(`<div class="rules"><h2>So funktioniert's</h2>
<p><b>Ziel:</b> Als Erste:r die vereinbarte Zahl an Songs chronologisch richtig in der eigenen Zeitleiste haben.</p>
<p><b>Start:</b> Jede:r bekommt einen aufgedeckten Song mit Jahr als Anker.</p>
<p><b>Ein Zug:</b></p><ol>
<li>Der <b>DJ</b> (die Person vor dir in der Reihenfolge) startet den Song über den grünen Button in Spotify und hält den Bildschirm verdeckt.</li>
<li>Du hörst zu und sagst, in welche Lücke deiner Zeitleiste der Song gehört. Dafür tippst du in der App auf die Lücke.</li>
<li>Andere können mit einem <b>Token</b> herausfordern und eine andere Lücke wählen. Liegst du falsch und die Herausforderin richtig, bekommt sie die Karte.</li>
<li>Beim <b>Auflösen</b> erscheinen Jahr, Titel und Interpret. Hast du Titel <b>und</b> Interpret genannt, gibt es +1 Token (maximal 5).</li></ol>
<p><b>Tokens</b> kann man auch ausgeben, um einen Song zu überspringen.</p>
<p><b>🔔 Buzzer-Modus:</b> Der Spielleiter öffnet einen Raum, alle anderen treten mit dem eigenen Handy per QR-Code bei. Läuft ein Song, darf jeder buzzern. Wer zuerst drückt, ordnet den Song auf seinem Handy in die eigene Zeitleiste ein. Liegt er falsch, kostet das einen Token und die anderen dürfen buzzern. Haben alle falsch geraten, fliegt die Karte raus.</p>
<p><b>Extras:</b> Vor dem Auflösen kannst du aus 4 Möglichkeiten den Song tippen (+1 Token) und ein exaktes Jahr schätzen (Volltreffer +2, ±1 Jahr +1 Token).</p>
<p><b>Profi-Modus:</b> Die Karte zählt nur, wenn Position und Titel + Interpret stimmen.</p>
<p><b>Gleiches Jahr:</b> Liegen zwei Songs im selben Jahr, ist jede Position direkt daneben richtig.</p>
<p class="small">Mit Spotify-Verbindung spielt die App den Song direkt auf dem gewählten Gerät ab, ein DJ ist dann nicht nötig. Ohne Verbindung öffnet Spotify die Suche. Den Treffer mit dem passenden Interpreten nehmen, möglichst die Originalversion. Wird der Song nicht gefunden, gibt es kostenlos einen neuen. Der Spielstand wird auf diesem Gerät zwischengespeichert.</p></div>
<button class="btn primary" onclick="closeModal()">Alles klar</button>`);}

if(JOIN) renderC(); else spCallback().finally(render);
</script>
</body>
</html>
