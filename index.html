<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HitBeat – Musik-Zeitleisten-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4fa; --panel:#ffffff; --panel2:#f0eef7; --ink:#1d1b2e; --muted:#6e6a85; --line:#e7e4f0;
    --accent:#7c3aed; --accent-b:#ec4899; --accent2:#0d9488; --gold:#d48806; --bad:#e5484d; --good:#16a34a;
    --grad:linear-gradient(135deg,#7c3aed 0%,#c026d3 55%,#ec4899 100%);
    --shadow:0 1px 2px rgba(29,27,46,.04),0 6px 24px rgba(29,27,46,.07);
    --shadow-lg:0 2px 4px rgba(29,27,46,.05),0 16px 40px rgba(124,58,237,.16);
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:
    radial-gradient(900px 480px at 110% -15%, rgba(236,72,153,.13), transparent 60%),
    radial-gradient(800px 480px at -20% -10%, rgba(124,58,237,.12), transparent 60%),
    radial-gradient(700px 400px at 50% 120%, rgba(13,148,136,.08), transparent 60%), var(--bg)}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
  h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;letter-spacing:-.4px}
  h1{font-size:32px;font-weight:800;letter-spacing:-1px}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:21px;font-weight:700;margin-bottom:10px}
  h3{font-size:17px;font-weight:700}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .panel{background:var(--panel);border-radius:var(--radius);padding:18px;margin-top:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  input[type=text],input[type=number],select{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:#fbfaff;color:var(--ink);font-size:16px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,58,237,.12);background:#fff}
  ::placeholder{color:#a9a5bd}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .btn{appearance:none;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;margin-top:10px;transition:transform .08s,box-shadow .15s,background .15s;box-shadow:0 1px 2px rgba(29,27,46,.04)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(192,38,211,.28)}
  .btn.primary .small{color:rgba(255,255,255,.85)!important}
  .btn.spotify{background:#1ed760;color:#052e14;border-color:transparent;font-size:18px;padding:18px;box-shadow:0 6px 18px rgba(30,215,96,.3)}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);box-shadow:none}
  .btn.small{padding:9px 13px;font-size:14px;width:auto;margin-top:0;border-radius:12px}
  .btn:disabled{opacity:.4;pointer-events:none}
  .seg{display:flex;background:var(--panel2);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:11px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(29,27,46,.1),0 2px 8px rgba(124,58,237,.12)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-top:14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap;box-shadow:0 1px 2px rgba(29,27,46,.04)}
  .chip.active{border-color:var(--accent);background:#f5f0ff;color:var(--accent)}
  .chip b{font-weight:700}
  .tok{color:var(--gold);font-weight:600}
  .turnbox{text-align:center}
  .big{font-family:"Bricolage Grotesque";font-size:36px;font-weight:800;line-height:1.05;letter-spacing:-1px}
  .dj{display:inline-block;background:rgba(13,148,136,.1);color:var(--accent2);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;margin-top:10px}
  .hint{color:var(--muted);font-size:14px;line-height:1.5;margin-top:10px}
  .vinyl{width:132px;height:132px;margin:18px auto 6px;border-radius:50%;background:
    radial-gradient(circle,#fff 0 4%,#d946ef 4.5% 10%,#a855f7 10.5% 17%,#2a2740 18% 30%,#18162a 31% 32%,#2a2740 33% 46%,#18162a 47% 48%,#2a2740 49% 62%,#18162a 63% 64%,#2a2740 65%);
    animation:spin 3s linear infinite;box-shadow:0 14px 36px rgba(124,58,237,.3)}
  .vinyl.stop{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}
  .timeline{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin-top:12px}
  .card{background:#fff;border-radius:14px;padding:9px 11px 9px 12px;min-width:86px;max-width:142px;flex:0 0 auto;border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(29,27,46,.06);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
  .card .y{font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
  .card .t{font-size:11.5px;font-weight:600;line-height:1.25;color:var(--ink);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .a{font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .card.new{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  .card.new::before{background:var(--accent2)}
  .slot{flex:0 0 auto;width:40px;border-radius:14px;border:2px dashed #d6d1e6;background:rgba(255,255,255,.5);color:#a9a5bd;font-size:20px;cursor:pointer;min-height:64px;font-family:inherit;transition:all .15s}
  .slot.sel{border-style:solid;border-color:var(--accent);background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(192,38,211,.3)}
  .slot.ch{border-style:solid;border-color:var(--gold);background:#fff4dc;color:var(--gold)}
  .slot.both{border-color:var(--accent)}
  .result{text-align:center;padding:6px 0}
  .result .year{font-family:"Bricolage Grotesque";font-size:68px;font-weight:800;line-height:1;letter-spacing:-2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .result .title{font-size:20px;font-weight:700;margin-top:6px}
  .result .artist{color:var(--muted)}
  .verdict{margin-top:14px;padding:13px;border-radius:14px;font-weight:600}
  .verdict.ok{background:#e8f8ee;color:var(--good)}
  .verdict.no{background:#fdecec;color:var(--bad)}
  .verdict.neutral{background:var(--panel2);color:var(--ink)}
  .toggle{display:flex;align-items:center;gap:12px;background:var(--panel2);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer;user-select:none;transition:background .15s}
  .toggle .box{width:26px;height:26px;border-radius:8px;border:2px solid #c9c4da;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:800;color:transparent}
  .toggle.on{background:#f0fbf4}
  .toggle.on .box{background:var(--good);border-color:var(--good);color:#fff}
  .players .prow{display:flex;gap:8px;margin-top:8px}
  .players .prow input{flex:1}
  .x{width:46px;flex:0 0 46px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);font-size:18px;cursor:pointer}
  .modal-bg{position:fixed;inset:0;background:rgba(29,27,46,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .modal{background:var(--panel);border-radius:26px 26px 0 0;padding:22px 18px 30px;width:100%;max-width:720px;max-height:85vh;overflow:auto;box-shadow:0 -10px 40px rgba(29,27,46,.15)}
  .modal::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:#dcd8e8;margin:-8px auto 14px}
  .rules p,.rules li{color:var(--muted);font-size:14px;line-height:1.55}
  .rules b{color:var(--ink)}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .linkish{background:none;border:0;color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
  .confetti{font-size:54px;text-align:center}
  .small{font-size:12.5px;color:var(--muted)}
  .picks{display:flex;flex-wrap:wrap;gap:6px}
  .pick{border:1.5px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 13px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pick .cnt{opacity:.6;font-weight:500;margin-left:2px}
  .pick.all{background:transparent;color:var(--accent);border-style:dashed}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;max-width:90%;z-index:20;box-shadow:0 10px 30px rgba(29,27,46,.25)}
  .ok-badge{display:inline-block;background:#e6f9ee;color:#15803d;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
  code.uri{display:block;background:var(--panel2);padding:10px 12px;border-radius:12px;font-size:13px;word-break:break-all;margin-top:6px;color:var(--accent)}
  .dev{display:flex;justify-content:space-between;align-items:center}
  textarea{font-family:ui-monospace,monospace}
</style>
</head>

const djIndex=()=>S.players.length<2?S.cur:(S.cur-1+S.players.length)%S.players.length;
const MAXTOK=5;

function slotOk(tl,slot,y){const s=sorted(tl).map(id=>song(id).year);return (slot===0||s[slot-1]<=y)&&(slot===s.length||y<=s[slot]);}
function draw(){if(!S.deck.length){S.deck=shuffle(poolIds().filter(id=>id!==S.song&&!S.players.some(p=>p.timeline.includes(id))));}if(!S.deck.length){toast("Alle Songs dieser Auswahl sind gespielt, es geht von vorn los.");S.deck=shuffle(poolIds().filter(id=>id!==S.song));}return S.deck.pop();}
const GENRES=[["pop","Pop"],["rock","Rock"],["soul","Soul, Funk & Disco"],["dance","Dance & Elektro"],["hiphop","Hip-Hop & R&B"],["schlager","Schlager"],["latin","Latin & Reggae"]];
const DECADES=[[1960,"bis 60er"],[1970,"70er"],[1980,"80er"],[1990,"90er"],[2000,"2000er"],[2010,"2010er"],[2020,"2020er"]];
const decOf=y=>y<1970?1960:Math.min(2020,Math.floor(y/10)*10);
function songOk(s,skip){
  return (S.pool==="all"||(S.pool==="de"?s.de:!s.de))
    &&(skip==="genres"||!S.genres||S.genres.includes(s.genre))
    &&(skip==="decades"||!S.decades||S.decades.includes(decOf(s.year)));
}
function poolIds(){return SONGS.filter(s=>songOk(s)).map(s=>s.id);}
function togSel(key,val){
  const all=(key==="genres"?GENRES:DECADES).map(x=>x[0]);
  let cur=(S[key]||all).slice();
  cur=cur.includes(val)?cur.filter(x=>x!==val):cur.concat(val);
  if(!cur.length){toast("Mindestens eins muss ausgewählt bleiben");return;}
  S[key]=cur.length===all.length?null:cur; render();
}
function onlySel(key,val){S[key]=[val];render();}
function pickChips(key,list){
  const sel=S[key];
  return `<div class="picks">${list.map(([v,l])=>{
    const n=SONGS.filter(s=>songOk(s,key)&&(key==="genres"?s.genre===v:decOf(s.year)===v)).length;
    const on=!sel||sel.includes(v);
    return `<button class="pick ${on?"on":""}" onclick="togSel('${key}',${typeof v==="number"?v:`'${v}'`})">${on?"✓ ":""}${l} <span class="cnt">${n}</span></button>`;}).join("")}
    ${sel?`<button class="pick all" onclick="S.${key}=null;render()">Alle</button>`:""}</div>`;
}
function poolCheck(nPlayers){
  const n=poolIds().length, need=nPlayers*S.target+8;
  if(n>=need) return true;
  modal(`<h2>Zu wenige Songs</h2><p class="hint">Mit dieser Auswahl gibt es nur <b>${n}</b> Songs. Für ${nPlayers} Spieler und ${S.target} Karten zum Sieg braucht es mindestens <b>${need}</b>. Wähl mehr Genres oder Jahrzehnte aus oder spielt auf weniger Karten.</p><button class="btn primary" onclick="closeModal()">OK</button>`);
  return false;
}

// ---------- Spotify (PKCE + Web API, steuert ein Spotify-Connect-Gerät) ----------
const LS={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const REDIRECT=location.origin+location.pathname;
const SCOPES="user-read-playback-state user-modify-playback-state streaming user-read-email user-read-private";
const SP={
  get cid(){return LS.get("hb-cid")||"ef5b4a8591514b889f1827ebafa80be4";},
  get tok(){return LS.get("hb-tok");},
  get connected(){return !!(this.tok&&this.tok.refresh);},
  get device(){return LS.get("hb-dev");},
  get startAt(){const v=LS.get("hb-start");return v===null?-1:v;},
};
function toast(msg,ms=3500){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function randStr(n){const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";const a=crypto.getRandomValues(new Uint8Array(n));return Array.from(a,x=>c[x%c.length]).join("");}

async function spLogin(){
  const cid=(document.getElementById("cid")?.value||SP.cid).trim();
  if(!cid){toast("Bitte zuerst die Client ID eintragen.");return;}
  LS.set("hb-cid",cid);
  const verifier=randStr(64), state=randStr(16);
  LS.set("hb-pkce",{verifier,state});
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  const p=new URLSearchParams({client_id:cid,response_type:"code",redirect_uri:REDIRECT,scope:SCOPES,code_challenge_method:"S256",code_challenge:challenge,state});
  location.href="https://accounts.spotify.com/authorize?"+p;
}
async function tokenRequest(params){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(params)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"Token-Fehler");
  const old=SP.tok||{};
  LS.set("hb-tok",{access:j.access_token,refresh:j.refresh_token||old.refresh,scope:j.scope||old.scope||"",exp:Date.now()+(j.expires_in-60)*1000});
}
async function spCallback(){
  const q=new URLSearchParams(location.search);
  if(!q.has("code")&&!q.has("error")) return;
  history.replaceState(null,"",location.pathname);
  if(q.has("error")){toast("Spotify-Anmeldung abgebrochen: "+q.get("error"));return;}
  const pk=LS.get("hb-pkce");
  if(!pk||pk.state!==q.get("state")){toast("Anmeldung ungültig, bitte erneut verbinden.");return;}
  try{await tokenRequest({grant_type:"authorization_code",code:q.get("code"),redirect_uri:REDIRECT,client_id:SP.cid,code_verifier:pk.verifier});LS.del("hb-pkce");toast("✅ Mit Spotify verbunden");}
  catch(e){toast("Anmeldung fehlgeschlagen: "+e.message,6000);}
}
async function accessToken(){
  const t=SP.tok; if(!t) throw new Error("Nicht verbunden");
  if(Date.now()>t.exp) await tokenRequest({grant_type:"refresh_token",refresh_token:t.refresh,client_id:SP.cid});
  return SP.tok.access;
}
async function api(method,path,body,retry=true){
  const r=await fetch("https://api.spotify.com/v1"+path,{method,headers:{Authorization:"Bearer "+await accessToken(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry){const t=SP.tok;t.exp=0;LS.set("hb-tok",t);return api(method,path,body,false);}
  return r;
}
function spLogout(){LS.del("hb-tok");LS.del("hb-dev");render();}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
async function findUri(s){
  const cache=LS.get("hb-uris")||{}; const key=s.title+"|"+s.artist;
  if(cache[key]) return typeof cache[key]==="string"?{uri:cache[key],dur:0}:cache[key];
  const main=s.artist.split(/ ft\.| feat\.| & /i)[0];
  const tries=[`track:${s.title} artist:${main}`,`${s.title} ${main}`];
  for(const q of tries){
    const r=await api("GET","/search?"+new URLSearchParams({q,type:"track",limit:"10",market:"DE"}));
    if(!r.ok) continue;
    const items=((await r.json()).tracks||{}).items||[];
    const nt=norm(s.title), na=norm(main);
    const good=items.filter(t=>t.artists.some(a=>norm(a.name).includes(na)||na.includes(norm(a.name))));
    // Bevorzugt Versionen ohne "Live", "Remix", "Karaoke" usw.
    const bad=/live|remix|karaoke|instrumental|cover|tribute|acoustic|re-record|edit\)/i;
    const pick=good.find(t=>norm(t.name).startsWith(nt)&&!bad.test(t.name))||good.find(t=>!bad.test(t.name))||good[0];
    if(pick){cache[key]={uri:pick.uri,dur:pick.duration_ms||0};LS.set("hb-uris",cache);return cache[key];}
  }
  return null;
}
// ---- Wiedergabe direkt in diesem Browser (Spotify Web Playback SDK) ----
let webPlayer=null, webDeviceId=null, sdkPromise=null;
const WEB={id:"web",name:"Dieses Gerät (Browser)"};
function loadSdk(){
  if(window.Spotify) return Promise.resolve();
  if(sdkPromise) return sdkPromise;
  sdkPromise=new Promise((res,rej)=>{
    window.onSpotifyWebPlaybackSDKReady=()=>res();
    const s=document.createElement("script"); s.src="https://sdk.scdn.co/spotify-player.js";
    s.onerror=()=>{sdkPromise=null;rej(new Error("Spotify-Player konnte nicht geladen werden"));};
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error("Zeitüberschreitung beim Laden des Players")),15000);
  });
  return sdkPromise;
}
async function initWebPlayer(){
  if(webDeviceId) return webDeviceId;
  if(!(SP.tok.scope||"").includes("streaming")) throw new Error("RECONNECT");
  await loadSdk();
  if(!webPlayer) webPlayer=new Spotify.Player({name:"HitBeat",getOAuthToken:cb=>accessToken().then(cb).catch(()=>{}),volume:0.9});
  return new Promise((res,rej)=>{
    webPlayer.addListener("ready",({device_id})=>{webDeviceId=device_id;res(device_id);});
    webPlayer.addListener("not_ready",()=>{webDeviceId=null;});
    webPlayer.addListener("initialization_error",({message})=>rej(new Error("UNSUPPORTED:"+message)));
    webPlayer.addListener("authentication_error",()=>rej(new Error("RECONNECT")));
    webPlayer.addListener("account_error",()=>rej(new Error("Für die Wiedergabe im Browser ist Spotify Premium nötig.")));
    webPlayer.addListener("player_state_changed",st=>{if(!st)return;const pl=!st.paused;if(pl!==S.playing){S.playing=pl;render();}});
    webPlayer.connect().then(ok=>{if(!ok)rej(new Error("Player-Verbindung fehlgeschlagen"));});
    setTimeout(()=>rej(new Error("Zeitüberschreitung beim Start des Players")),15000);
  });
}
function webError(e){
  if(e.message==="RECONNECT"){modal(`<h2>Neu verbinden</h2><p class="hint">Für die Wiedergabe auf diesem Gerät braucht HitBeat zusätzliche Rechte von Spotify. Einmal neu verbinden, dann klappt es.</p><button class="btn spotify" onclick="spLogin()">Neu mit Spotify verbinden</button><button class="btn ghost" onclick="closeModal()">Später</button>`);return;}
  if(e.message.startsWith("UNSUPPORTED")){modal(`<h2>Browser nicht unterstützt</h2><p class="hint">Dieser Browser kann Spotify nicht direkt abspielen. Das betrifft vor allem Safari auf dem iPhone. Alternativ kannst du die <b>Spotify-App auf diesem Handy</b> als Gerät wählen. Dann zeigt Spotify allerdings Titel auf dem Sperrbildschirm an.</p><button class="btn" onclick="chooseDevice()">Anderes Gerät wählen</button><button class="btn ghost" onclick="closeModal()">Schließen</button>`);return;}
  toast(e.message,6000);
}
async function getDevices(){const r=await api("GET","/me/player/devices");if(!r.ok) return [];return (await r.json()).devices||[];}
async function chooseDevice(){
  modal(`<h2>Wiedergabegerät</h2><p class="sub">Lädt…</p>`);
  let devs=[];try{devs=await getDevices();}catch(e){}

   <div class="small" style="margin:4px 0 8px">Spielt direkt hier in HitBeat ab, ohne Spotify-App. Klappt am PC, Mac und auf Android-Chrome, nicht auf dem iPhone (auch nicht in Chrome).</div>
   ${devs.filter(d=>d.id!==webDeviceId).length?devs.filter(d=>d.id!==webDeviceId).map(d=>`<button class="btn ${SP.device&&SP.device.id===d.id?"primary":""}" onclick='setDevice(${JSON.stringify({id:d.id,name:d.name}).replace(/'/g,"&#39;")})'><span class="dev" style="width:100%"><span>${esc(d.name)}</span><span class="small">${esc(d.type)}</span></span></button>`).join("")
   :`<p class="hint">Kein weiteres Gerät gefunden. Öffne die <b>Spotify-App</b> auf dem Handy, Lautsprecher oder PC, spiel kurz irgendetwas ab und tippe dann auf Aktualisieren.</p>`}
   <button class="btn ghost" onclick="chooseDevice()">↻ Aktualisieren</button>
   <button class="btn ghost" onclick="closeModal()">Schließen</button>`);
}
function setDevice(d){LS.set("hb-dev",d);closeModal();render();toast("Gerät: "+d.name);}
let busy=false;
async function spPlay(){
  if(busy) return; busy=true;
  try{
    if(!SP.device){busy=false;chooseDevice();return;}
    if(SP.device.id==="web"&&webPlayer&&webPlayer.activateElement) webPlayer.activateElement();
    const s=song(S.song);
    const tr=await findUri(s);
    if(!tr){toast("Song nicht auf Spotify gefunden, nächster Song kommt.");S.song=draw();S.opened=false;save();busy=false;return spPlay();}
    let devId=SP.device.id;
    if(devId==="web"){try{devId=await initWebPlayer();}catch(e){busy=false;webError(e);return;}}
    let r=await api("PUT","/me/player/play?device_id="+encodeURIComponent(devId),{uris:[tr.uri],position_ms:startPos(tr)});
    if(r.status===404&&SP.device.id==="web"){webDeviceId=null;try{devId=await initWebPlayer();r=await api("PUT","/me/player/play?device_id="+encodeURIComponent(devId),{uris:[tr.uri],position_ms:startPos(tr)});}catch(e){busy=false;webError(e);return;}}
    if(r.status===404){toast("Gerät nicht erreichbar. Öffne Spotify dort und wähle es neu.",5000);LS.del("hb-dev");busy=false;chooseDevice();return;}
    if(r.status===403){toast("Spotify verweigert die Wiedergabe (Premium nötig oder Funktion eingeschränkt).",6000);}
    else if(!r.ok){const j=await r.json().catch(()=>({}));toast("Fehler beim Abspielen: "+((j.error&&j.error.message)||r.status),6000);}
    else {S.opened=true;S.playing=true;remainMs=0;armStop(playLen()*1000);save();render();bzOpened();}
  }catch(e){toast("Fehler: "+e.message,6000);}
  busy=false;
}
function startPos(tr){
  if(SP.startAt!==-1) return SP.startAt;
  const d=tr.dur||200000; // Zufällig zwischen 25 % und 65 % der Songlänge
  return Math.floor(d*(0.25+Math.random()*0.4));
}
// ---- Abspieldauer & Stopp ----
let stopTimer=null, playEndsAt=0, remainMs=0;
const playLen=()=>{const v=LS.get("hb-len");return v===null?0:v;}; // Sekunden, 0 = ganzer Song
function armStop(ms){clearTimeout(stopTimer);stopTimer=null;if(!ms)return;playEndsAt=Date.now()+ms;stopTimer=setTimeout(()=>{stopTimer=null;remainMs=0;if(S.playing)spPause(true);},ms);}
function devQ(){return SP.device&&SP.device.id!=="web"?"?device_id="+encodeURIComponent(SP.device.id):"";}
async function spResume(){
  const ms=playLen()?(remainMs>500?remainMs:playLen()*1000):0;
  if(SP.device&&SP.device.id==="web"&&webPlayer&&webDeviceId){await webPlayer.resume();S.playing=true;armStop(ms);render();return;}
  try{const r=await api("PUT","/me/player/play"+devQ());if(r.ok||r.status===204){S.playing=true;armStop(ms);render();}else spPlay();}catch(e){toast("Fehler: "+e.message);}
}
async function spPause(auto){
  if(!auto&&stopTimer){remainMs=Math.max(0,playEndsAt-Date.now());}
  clearTimeout(stopTimer);stopTimer=null;
  if(SP.device&&SP.device.id==="web"&&webPlayer){try{await webPlayer.pause();}catch(e){}S.playing=false;save();render();return;}
  try{await api("PUT","/me/player/pause"+devQ());S.playing=false;save();render();}catch(e){toast("Fehler: "+e.message);}
}
function stopMusic(){
  clearTimeout(stopTimer);stopTimer=null;remainMs=0;
  if(SP.connected&&(S.playing||S.opened)){spPause(true);}
  S.playing=false;
}

});

// ---------- Buzzer-Modus: mehrere Handys, verbunden über MQTT-Broker ----------
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&window.QRCode)return res();const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("Konnte nicht geladen werden: "+src));document.head.appendChild(s);});}
const QRJS="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
// Verbindung ohne WebRTC: Alle Handys reden über öffentliche MQTT-Broker (WebSocket, Port 443-ähnlich).
// Es laufen zwei Broker parallel, fällt einer aus, trägt der andere. Der Raum lebt auf dem Broker,
// auch wenn das Spielleiter-Handy zwischendurch im Standby ist.
const BROKERS=(()=>{const o=LS.get("hb-brokers");return Array.isArray(o)&&o.length?o:["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];})();
const TOPIC=r=>"hitbeat/v2/"+r;
const enc=new TextEncoder(), dec=new TextDecoder();
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function mqStr(s){const b=typeof s==="string"?enc.encode(s):s;return [b.length>>8,b.length&255,...b];}
function mqPkt(type,body){const len=[];let n=body.length;do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;len.push(d);}while(n>0);return new Uint8Array([type,...len,...body]);}
// Minimaler MQTT-3.1.1-Client über WebSocket mit automatischem Wiederverbinden
class MqLink{
  constructor(url,o){this.url=url;this.o=o;this.ok=false;this.ws=null;this.buf=new Uint8Array(0);this.subs=new Set();this.retry=0;this.pid=1;this.dead=false;this.last=0;this.open();}
  open(){
    if(this.dead)return; clearTimeout(this.rt);
    let ws; try{ws=new WebSocket(this.url,"mqtt");}catch(e){this.ws=null;return this.later();}
    this.ws=ws; ws.binaryType="arraybuffer"; this.buf=new Uint8Array(0);
    const ct=setTimeout(()=>{if(ws===this.ws&&!this.ok)this.drop();},10000);
    ws.onopen=()=>{
      if(ws!==this.ws)return;
      const w=this.o.will; let flags=0x02, pay=mqStr(this.o.id);
      if(w){flags|=0x04|(w.retain?0x20:0);pay=pay.concat(mqStr(w.topic),mqStr(w.payload));}
      ws.send(mqPkt(0x10,[...mqStr("MQTT"),4,flags,0,30,...pay]));
    };
    ws.onmessage=e=>{if(ws===this.ws)this.data(new Uint8Array(e.data));};
    ws.onclose=ws.onerror=()=>{
      clearTimeout(ct); if(ws!==this.ws)return;
      this.ws=null; const was=this.ok; this.ok=false; clearInterval(this.pt);
      if(was&&this.o.onDown)this.o.onDown(this);
      this.later();
    };
  }
  later(){if(this.dead)return;clearTimeout(this.rt);this.retry++;this.rt=setTimeout(()=>this.open(),Math.min(10000,500*2**Math.min(this.retry,5)));}
  drop(){const ws=this.ws;if(!ws)return;ws.onclose&&ws.onclose();try{ws.close();}catch(e){}}
  // Nach Standby / Netzwechsel: sofort prüfen statt auf den nächsten Versuch zu warten
  kick(){
    if(this.dead)return;
    if(!this.ws){this.retry=0;this.open();return;}
    if(this.ok&&Date.now()-this.last>8000){this.ping();clearTimeout(this.kt);this.kt=setTimeout(()=>{if(this.ok&&Date.now()-this.last>7000)this.drop();},4000);}
  }
  data(chunk){
    this.last=Date.now();
    let b=new Uint8Array(this.buf.length+chunk.length); b.set(this.buf); b.set(chunk,this.buf.length);
    for(;;){
      if(b.length<2)break;
      let mul=1,len=0,i=1,d,complete=true;
      do{if(i>=b.length){complete=false;break;}d=b[i++];len+=(d&127)*mul;mul*=128;}while(d&128);
      if(!complete||b.length<i+len)break;
      const h=b[0], body=b.slice(i,i+len); b=b.slice(i+len);
      this.pkt(h>>4,h,body);
    }
    this.buf=b;
  }
  pkt(type,h,body){
    if(type===2){
      if(body[1]!==0){this.drop();return;}
      this.ok=true; this.retry=0; clearInterval(this.pt); this.pt=setInterval(()=>this.ping(),20000);
      for(const t of this.subs)this.sendSub(t);
      this.o.onUp&&this.o.onUp(this);
    } else if(type===3){
      const tl=(body[0]<<8)|body[1], topic=dec.decode(body.subarray(2,2+tl));
      let off=2+tl; if((h>>1)&3)off+=2;
      const txt=dec.decode(body.subarray(off)); if(!txt)return;
      let m; try{m=JSON.parse(txt);}catch(e){return;}
      if(m&&typeof m==="object"&&this.o.onMsg)this.o.onMsg(topic,m,this);
    }
  }
  ping(){this.raw(new Uint8Array([0xC0,0]));}
  raw(p){if(this.ws&&this.ws.readyState===1){try{this.ws.send(p);return true;}catch(e){}}return false;}
  sendSub(t){this.pid=(this.pid%65000)+1;this.raw(mqPkt(0x82,[this.pid>>8,this.pid&255,...mqStr(t),0]));}
  sub(t){this.subs.add(t);if(this.ok)this.sendSub(t);}
  pub(topic,obj,retain){if(!this.ok)return false;const p=obj==null?[]:[...enc.encode(JSON.stringify(obj))];return this.raw(mqPkt(0x30|(retain?1:0),[...mqStr(topic),...p]));}
  close(){this.dead=true;clearTimeout(this.rt);clearInterval(this.pt);if(this.ok)this.raw(new Uint8Array([0xE0,0]));const ws=this.ws;this.ws=null;this.ok=false;try{ws&&ws.close();}catch(e){}}
}
// Bündelt alle Broker: senden an alle, doppelte Nachrichten beim Empfang aussortieren
class Bus{
  constructor(o){
    this.o=o; this.seen=new Set();
    this.links=BROKERS.map(u=>new MqLink(u,{id:"hb"+rid(),will:o.will,
      onUp:l=>{o.onUp&&o.onUp(l);o.onChange&&o.onChange();},
      onDown:()=>{o.onChange&&o.onChange();},
      onMsg:(t,m,l)=>this.msg(t,m,l)}));
  }
  get up(){return this.links.some(l=>l.ok);}
  msg(t,m,l){
    if(m._id&&!t.endsWith("/host")){if(this.seen.has(m._id))return;this.seen.add(m._id);if(this.seen.size>600)this.seen=new Set([...this.seen].slice(-300));}
    this.o.onMsg(t,m,l);
  }
  sub(t){this.links.forEach(l=>l.sub(t));}
  pub(t,m,retain){const x=m?{...m,_id:rid(),_ts:Date.now()}:null;let ok=false;this.links.forEach(l=>{if(l.pub(t,x,retain))ok=true;});return ok;}
  kick(){this.links.forEach(l=>l.kick());}
  close(){this.links.forEach(l=>l.close());}
}

// ---------- Buzzer-Modus: Spielleiter-Seite ----------
let hbus=null, hostOnline=false; const conns={}; // Name -> {cid, seen}
function roomCode(){const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from(crypto.getRandomValues(new Uint8Array(5)),x=>c[x%c.length]).join("");}
// Fester Raum pro Spielleiter-Handy: gleicher Code und QR-Code bei jedem Spiel
function myRoom(){let r=LS.get("hb-room");if(typeof r!=="string"||!/^[A-Z0-9]{5}$/.test(r)){r=roomCode();LS.set("hb-room",r);}return r;}
function newRoomCode(){hostStop();LS.set("hb-room",roomCode());S.room=LS.get("hb-room");save();hostStart();render();toast("Neuer Raum-Code: "+S.room);}
const joinUrl=()=>location.origin+location.pathname+"#join-"+S.room;
const isBz=()=>S.game==="buzzer";
const isOn=name=>!!(conns[name]&&Date.now()-conns[name].seen<50000);
function hostStart(){
  if(hbus||!isBz()||!S.room) return;
  const R=TOPIC(S.room);
  hbus=new Bus({
    will:{topic:R+"/host",payload:JSON.stringify({t:"host",on:false}),retain:true},
    onUp:()=>hostAnnounce(),
    onChange:()=>{const u=!!(hbus&&hbus.up);if(u!==hostOnline){hostOnline=u;render();}},
    onMsg:(t,m)=>{if(t===R+"/c")onHostMsg(m);}
  });
  hbus.sub(R+"/c");
}
// Nach jedem (Wieder-)Verbinden: Raum als offen markieren, alle Mitspieler melden sich neu
function hostAnnounce(){if(!hbus)return;const R=TOPIC(S.room);hbus.pub(R+"/host",{t:"host",on:true},true);pushScores();syncAll();hbus.pub(R+"/ev",{t:"ping"});}
function hostStop(){
  if(hbus){try{hbus.pub(TOPIC(S.room)+"/host",{t:"host",on:false},true);}catch(e){}const b=hbus;setTimeout(()=>b.close(),300);}
  hbus=null; hostOnline=false; for(const k in conns)delete conns[k];
}
// Nach Standby / Wechsel der App / WLAN-Wechsel sofort neu verbinden
function onWake(){
  if(document.visibilityState==="hidden") return;
  if(hbus) hbus.kick();
  if(JOIN&&C.status!=="name"){if(cbus)cbus.kick();else clientConnect();}
}
document.addEventListener("visibilitychange",onWake);
window.addEventListener("online",onWake);
window.addEventListener("pageshow",onWake);
// Anzeige "verbunden/getrennt" aktuell halten
let presSig="";
setInterval(()=>{if(!hbus)return;const s=S.players.map(p=>isOn(p.name)?1:0).join("");if(s!==presSig){presSig=s;render();}},10000);
const pcid=name=>{const p=S.players.find(x=>x.name===name);return p&&p.cid;};
function send(name,msg){const cid=pcid(name);if(hbus&&cid)hbus.pub(TOPIC(S.room)+"/p/"+cid,{...msg,you:name},true);}
function broadcast(msg){if(hbus)hbus.pub(TOPIC(S.room)+"/ev",msg);}
function scores(){return S.players.map(p=>({name:p.name,cards:p.timeline.length,tokens:p.tokens}));}
function pushScores(){if(hbus)hbus.pub(TOPIC(S.room)+"/all",{t:"scores",players:scores(),target:S.target},true);}
function onHostMsg(d){
  if(!d||typeof d!=="object"||!d.cid) return;
  const cid=String(d.cid).slice(0,40);
  if(d.t==="bye"){for(const n in conns)if(conns[n].cid===cid)delete conns[n];render();return;}
  const name=String(d.name||"").trim().slice(0,20); if(!name) return;
  if(d.t==="join"||d.t==="hello"){
    let p=S.players.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!p){p={name,tokens:S.startTokens,timeline:[]};if(S.phase!=="bz-lobby")p.timeline.push(draw());S.players.push(p);toast("👋 "+name+" ist beigetreten");}
    const known=isOn(p.name)&&conns[p.name].cid===cid;
    for(const n in conns)if(conns[n].cid===cid&&n!==p.name)delete conns[n]; // Name gewechselt
    p.cid=cid; conns[p.name]={cid,seen:Date.now()};
    if(!known||d.t==="join"){pushScores();syncClient(p.name);save();render();}
    return;
  }
  const n=Object.keys(conns).find(k=>conns[k].cid===cid); if(!n) return;
  conns[n].seen=Date.now();
  if(d.t==="buzz") bzBuzz(n);
  else if(d.t==="submit"){const p=S.players[S.cur]; if(S.phase==="bz-answer"&&p&&p.name===n) bzEvaluate(d);}
}
function answerMsg(){
  const p=S.players[S.cur];
  if(S.mcGuess!==false&&!S.mc) makeMC();
  const info=id=>{const s=song(id);return {id,t:s.title,a:s.artist,y:s.year};};
  return {t:"answer",tl:sorted(p.timeline).map(info),mc:S.mcGuess!==false?S.mc.map(id=>{const o=info(id);delete o.y;return o;}):null,yg:S.yearGuess!==false,pro:S.mode==="pro"};
}
function syncClient(name){
  if(!pcid(name)) return;
  const tried=(S.tried||[]).includes(name);
  if(S.phase==="bz-lobby") send(name,{t:"wait",text:"Warte, bis der Spielleiter startet …"});
  else if(S.phase==="bz-listen") send(name,!S.opened?{t:"wait",text:"Gleich kommt der nächste Song …"}:tried?{t:"tried"}:{t:"open"});
  else if(S.phase==="bz-answer"){const p=S.players[S.cur];send(name,p.name===name?answerMsg():{t:"locked",name:p.name});}
  else if(S.phase==="bz-reveal") send(name,revealMsg());
  else if(S.phase==="win") send(name,{t:"win",name:S.players[S.winner].name});
  else send(name,{t:"wait",text:"Spielleiter ist im Menü …"});
}
function syncAll(){S.players.forEach(p=>syncClient(p.name));}
function revealMsg(){const r=S.bzResult,s=song(r.song);return {t:"reveal",title:s.title,artist:s.artist,year:s.year,winner:r.winner,ok:r.ok,gain:r.gain||0};}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.12;o.start();o.stop(a.currentTime+.25);}catch(e){}}

function bzCreate(){
  hostStop();

  S.deck=shuffle(poolIds()); S.tried=[]; S.bzResult=null;

  S.song=draw(); S.tried=[]; S.mc=null; S.mcPick=null; S.yearTip=""; S.slot=null; S.ch=null;
  S.opened=false; S.playing=false; S.hostAnswer=false; S.bzResult=null; S.phase="bz-listen";

function bzSkip(){ S.song=draw(); S.opened=false; S.playing=false; S.mc=null; save(); syncAll(); render(); }
function bzBuzz(name){
  if(S.phase!=="bz-listen"||!S.opened) return;
  const i=S.players.findIndex(p=>p.name===name);
  if(i<0||S.tried.includes(name)) return;
  S.cur=i; S.slot=null; S.mcPick=null; S.yearTip=""; S.hostAnswer=false; S.phase="bz-answer";
  if(SP.connected&&S.playing) spPause();
  beep(); save(); syncAll(); render();
}
function bzBuzzIdx(i){bzBuzz(S.players[i].name);}
function bzEvaluate(d){
  const p=S.players[S.cur], s=song(S.song);
  S.slot=+d.slot; S.mcPick=d.mcPick==null?null:+d.mcPick; S.yearTip=d.yearTip||""; S.hostAnswer=false;
  const placeOk=slotOk(p.timeline,S.slot,s.year);
  const guessed=S.mcGuess!==false&&S.mcPick===S.song;
  if(placeOk&&(S.mode==="normal"||guessed)){
    const tip=parseInt(S.yearTip,10), diff=isNaN(tip)?null:Math.abs(tip-s.year);
    const gain=(guessed?1:0)+(diff===0?2:diff===1?1:0);
    p.tokens=Math.min(MAXTOK,p.tokens+gain); p.timeline.push(S.song);
    S.bzResult={song:S.song,winner:p.name,ok:true,guessed,diff,gain};
    return bzFinish();
  }
  const penalty=p.tokens>0; if(penalty) p.tokens--;
  S.tried.push(p.name);
  const left=S.players.filter(q=>!S.tried.includes(q.name));
  if(!left.length){S.bzResult={song:S.song,winner:null,ok:false};return bzFinish();}
  toast(`❌ ${p.name} lag falsch${penalty?" (−1 Token)":""}. Buzzer ist wieder offen!`,4000);
  broadcast({t:"wrong",name:p.name,penalty});
  S.phase="bz-listen"; S.slot=null; S.mcPick=null; S.yearTip="";
  if(SP.connected&&S.opened) spResume();
  pushScores(); save(); syncAll(); render();
}

// ---------- Mitspieler-Ansicht (#join-CODE) ----------
const JOIN=(location.hash.match(/^#join-([A-Z0-9]{4,6})$/i)||[])[1];
let C={code:JOIN?JOIN.toUpperCase():"",name:LS.get("hb-name")||"",status:"name",view:{k:"wait",text:""},players:[],target:0,me:""};
const CID=(()=>{let c=LS.get("hb-cid");if(typeof c!=="string"||c.length<6){c="c"+rid();LS.set("hb-cid",c);}return c;})();
let cbus=null, cHelloT=null; const cTs={}, hostLinks=new Map();
function clientJoin(){
  const inp=document.getElementById("myName"); if(inp) C.name=inp.value.trim().slice(0,20);
  if(!C.name){toast("Bitte einen Namen eingeben");return;}
  LS.set("hb-name",C.name); C.status="connecting"; renderC();
  if(cbus){cHello("join");cStatus();cbus.kick();} else clientConnect();
}
function cSend(m){return !!(cbus&&cbus.pub(TOPIC(C.code)+"/c",{...m,cid:CID,name:C.name}));}
function cHello(kind){if(C.status!=="name")cSend({t:kind});}
function cStatus(){
  if(C.status==="name") return;
  const up=!!(cbus&&cbus.up), host=[...hostLinks].some(([l,on])=>on&&l.ok);
  const s=!up?(C.status==="connecting"?"connecting":"reconnecting"):host?"connected":"nohost";
  if(s!==C.status){C.status=s;renderC();}
}
function clientConnect(){
  if(cbus){cbus.kick();return;}
  const R=TOPIC(C.code);
  cbus=new Bus({
    will:{topic:R+"/c",payload:JSON.stringify({t:"bye",cid:CID}),retain:false},
    onUp:()=>cHello("join"),
    onChange:()=>{for(const l of [...hostLinks.keys()])if(!l.ok)hostLinks.delete(l);cStatus();},
    onMsg:(t,m,l)=>{
      if(t===R+"/host"){hostLinks.set(l,!!m.on);cStatus();return;}
      if(t===R+"/ev"){if(m.t==="ping"){cHello("hello");return;}}
      else if(m._ts){if(cTs[t]&&m._ts<cTs[t])return;cTs[t]=m._ts;} // veraltete gespeicherte Nachrichten ignorieren
      if(m.you)C.me=m.you;
      if(C.status==="name") return;
      onClientMsg(m);
    }
  });
  [R+"/host",R+"/all",R+"/ev",R+"/p/"+CID].forEach(x=>cbus.sub(x));
  clearInterval(cHelloT); cHelloT=setInterval(()=>cHello("hello"),20000);
}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function onClientMsg(d){
  if(!d||typeof d!=="object")return;
  switch(d.t){
    case "welcome": C.me=d.you; break;
    case "scores": C.players=d.players; C.target=d.target; break;
    case "wait": C.view={k:"wait",text:d.text}; break;
    case "open": C.view={k:"buzz"}; break;
    case "tried": if(C.view.k!=="wrong")C.view={k:"tried"}; break;
    case "locked": if(d.name!==C.me)C.view={k:"locked",name:d.name}; break;
    case "answer": C.view={k:"answer",tl:d.tl,mc:d.mc,yg:d.yg,pro:d.pro,slot:null,mcPick:null,yearTip:""}; vib(200); break;
    case "wrong": if(d.name===C.me)C.view={k:"wrong",penalty:d.penalty}; else toast(`❌ ${d.name} lag falsch. Buzzer ist wieder offen!`); break;
    case "reveal": C.view={k:"reveal",...d}; break;
    case "win": C.view={k:"win",name:d.name}; break;
  }
  renderC();
}
function clientBuzz(){if(cSend({t:"buzz"})){C.view={k:"buzzed"};vib(60);renderC();}else toast("Keine Verbindung, kurz warten …");}
function clientSubmit(){const v=C.view;if(v.slot==null)return;if(!cSend({t:"submit",slot:v.slot,mcPick:v.mcPick,yearTip:v.yearTip})){toast("Keine Verbindung, kurz warten …");return;}C.view={k:"submitted"};renderC();}
function cPick(i){C.view.slot=i;renderC();}
function cMc(id){C.view.mcPick=C.view.mcPick===id?null:id;renderC();}
function cTimeline(ids,interactive,slot){
  let h=`<div class="timeline">`;
  for(let i=0;i<=ids.length;i++){
    if(interactive)h+=`<button class="slot ${slot===i?"sel":""}" onclick="cPick(${i})">${slot===i?"♪":"+"}</button>`;
    if(i<ids.length){const s=ids[i];h+=`<div class="card"><div class="y">${s.y}</div><div class="t">${esc(s.t)}</div><div class="a">${esc(s.a)}</div></div>`;}
  }
  return h+`</div>`;
}
function renderC(){
  const a=$("#app"), v=C.view;
  let h=`<div class="topbar"><div><h1>Hit<span>Beat</span></h1><div class="sub">Raum ${esc(C.code)}${C.me?" · Du: "+esc(C.me):""}</div></div></div>`;
  if(C.players.length) h+=`<div class="chips">${C.players.map(p=>`<div class="chip ${p.name===C.me?"active":""}"><b>${esc(p.name)}</b> · 🎵 ${p.cards}/${C.target} · <span class="tok">● ${p.tokens}</span></div>`).join("")}</div>`;
  if(C.status==="name"){
    a.innerHTML=h+`<div class="panel"><h2>Mitspielen</h2><label>Dein Name</label><input type="text" id="myName" value="${esc(C.name)}" maxlength="20" placeholder="z. B. Anna"><button class="btn primary" onclick="clientJoin()">Beitreten</button></div>`;return;}
  const st={connecting:"⏳ Verbinde mit dem Raum …",reconnecting:"⏳ Verbindung unterbrochen, verbinde neu …",nohost:"⏳ Du bist im Raum. Der Spielleiter ist gerade nicht online, sobald er die App öffnet, geht es los.",error:"⚠️ "+esc(C.err||"Fehler")}[C.status];
  if(st){a.innerHTML=h+`<div class="panel turnbox"><div class="hint">${st}</div><button class="btn ghost" onclick="C.status='name';renderC()">Name ändern</button></div>`;return;}
  let b="";
  if(v.k==="wait") b=`<div class="panel turnbox"><div class="vinyl stop"></div><div class="hint">${esc(v.text||"Warte …")}</div></div>`;
  else if(v.k==="buzz") b=`<div class="turnbox" style="padding:30px 0"><button onclick="clientBuzz()" style="width:240px;height:240px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e0243c 60%,#9e1026);color:#fff;font-family:'Bricolage Grotesque';font-size:44px;font-weight:800;box-shadow:0 12px 0 #a3132b,0 22px 50px rgba(224,36,60,.35);cursor:pointer;-webkit-user-select:none">BUZZ!</button><div class="hint" style="margin-top:28px">Erkennst du den Song? Dann drück!</div></div>`;
  else if(v.k==="buzzed") b=`<div class="panel turnbox"><div class="big">🔔</div><div class="hint">Gebuzzert! Mal sehen, ob du der Schnellste warst …</div></div>`;
  else if(v.k==="tried") b=`<div class="panel turnbox"><div class="hint">Du hast in dieser Runde schon geantwortet. Jetzt sind die anderen dran.</div></div>`;
  else if(v.k==="wrong") b=`<div class="panel turnbox"><div class="verdict no">❌ Leider falsch${v.penalty?" (−1 Token)":""}</div><div class="hint">Jetzt dürfen die anderen buzzern.</div></div>`;
  else if(v.k==="locked") b=`<div class="panel turnbox"><div class="small">Gebuzzert</div><div class="big">🔔 ${esc(v.name)}</div><div class="hint">${esc(v.name)} antwortet gerade …</div></div>`;
  else if(v.k==="answer"){
    b=`<div class="panel turnbox" style="padding-bottom:6px"><div class="big">Du bist dran!</div></div>`;
    if(v.mc) b+=`<div class="panel"><h3>Welcher Song ist das?</h3><div class="small" style="margin-top:4px">${v.pro?"Im Profi-Modus nötig":"Richtig: +1 Token"}</div>${v.mc.map(o=>`<button class="btn ${v.mcPick===o.id?"primary":""}" style="flex-direction:column;align-items:flex-start;text-align:left;gap:2px" onclick="cMc(${+o.id})"><span>${esc(o.t)}</span><span class="small">${esc(o.a)}</span></button>`).join("")}</div>`;
    b+=`<div class="panel"><h3>Deine Zeitleiste</h3><div class="small" style="margin-top:4px">Tippe auf die Lücke, in die der Song gehört.</div>${cTimeline(v.tl,true,v.slot)}</div>`;
    if(v.yg) b+=`<div class="panel"><h3>Dein Jahrestipp</h3><div class="small" style="margin-top:4px">Optional. Volltreffer +2 · ±1 Jahr +1 Token</div><input type="number" inputmode="numeric" placeholder="z. B. 1985" value="${esc(v.yearTip)}" style="margin-top:8px" oninput="C.view.yearTip=this.value"></div>`;
    b+=`<button class="btn primary" ${v.slot==null?"disabled":""} onclick="clientSubmit()">Antwort abgeben</button>`;
  }
  else if(v.k==="submitted") b=`<div class="panel turnbox"><div class="hint">Antwort gesendet, gleich gibt's die Auflösung …</div></div>`;
  else if(v.k==="reveal") b=`<div class="panel result"><div class="year">${v.year}</div><div class="title">${esc(v.title)}</div><div class="artist">${esc(v.artist)}</div><div class="verdict ${v.ok?"ok":"no"}">${v.ok?(v.winner===C.me?"✅ Die Karte gehört dir!"+(v.gain?` +${v.gain} Token`:""):"✅ "+esc(v.winner)+" bekommt die Karte"):"Niemand lag richtig."}</div></div>`;
  else if(v.k==="win") b=`<div class="panel" style="text-align:center"><div class="confetti">🏆</div><div class="big">${v.name===C.me?"Du gewinnst!":esc(v.name)+" gewinnt!"}</div></div>`;
  a.innerHTML=h+b;
}

function makeMC(){
  const s=song(S.song), ids=poolIds().filter(id=>id!==S.song&&song(id).title!==s.title);
  let near=shuffle(ids.filter(id=>Math.abs(song(id).year-s.year)<=8));

  S.mc=shuffle([S.song,...near.slice(0,3)]);

function mcPanel(){

  if(!S.mc) makeMC();
  return `<div class="panel"><h3>Welcher Song ist das?</h3><div class="small" style="margin-top:4px">Richtig getippt: +1 Token${S.mode==="pro"?" · im Profi-Modus nötig, um die Karte zu behalten":""}</div>
  ${S.mc.map(id=>{const o=song(id);return `<button class="btn ${S.mcPick===id?"primary":""}" style="flex-direction:column;align-items:flex-start;text-align:left;gap:2px" onclick="S.mcPick=S.mcPick===${id}?null:${id};render()"><span>${esc(o.title)}</span><span class="small" style="color:${S.mcPick===id?"#ffe3ee":"var(--muted)"}">${esc(o.artist)}</span></button>`;}).join("")}</div>`;
}
function yearPanel(){
  if(S.yearGuess===false) return "";
  return `<div class="panel"><h3>Dein Jahrestipp</h3><div class="small" style="margin-top:4px">Optional. Volltreffer: +2 Tokens · ±1 Jahr: +1 Token</div>
  <input type="number" inputmode="numeric" min="1950" max="2030" placeholder="z. B. 1985" value="${esc(S.yearTip||"")}" style="margin-top:8px" oninput="S.yearTip=this.value;save()"></div>`;
}
function startCh(i){S.ch={p:i,slot:null,picking:true};render();}

function reveal(){
  const p=P(), s=song(S.song);
  const placeOk=slotOk(p.timeline,S.slot,s.year);
  let chOk=false;
  if(S.ch){S.players[S.ch.p].tokens--; chOk=!placeOk&&slotOk(p.timeline,S.ch.slot,s.year);}
  if(S.mcGuess!==false) S.guessed=S.mcPick===S.song;
  const tip=parseInt(S.yearTip,10), diff=isNaN(tip)?null:Math.abs(tip-s.year);
  S.log={placeOk,chOk,diff};
  S.phase="reveal"; render();
}
function viewReveal(){
  const p=P(), s=song(S.song), {placeOk,chOk}=S.log;
  const keep=placeOk&&(S.mode==="normal"||S.guessed);
  const diff=S.log.diff;
  let v,cls;
  if(placeOk){ cls=keep?"ok":"neutral"; v=keep?`✅ Richtig! ${esc(p.name)} behält die Karte.`:`Position richtig, aber im Profi-Modus braucht es auch Titel + Interpret.`; if(S.ch) v+=`<br><span class="small">Herausforderung von ${esc(S.players[S.ch.p].name)} gescheitert, der Token ist weg.</span>`;}
  else if(chOk){cls="no";v=`❌ Daneben. ${esc(S.players[S.ch.p].name)} lag richtig und bekommt die Karte!`;}
  else {cls="no";v=`❌ Daneben, die Karte fliegt raus.`+(S.ch?`<br><span class="small">${esc(S.players[S.ch.p].name)} lag auch falsch.</span>`:"");}
  return `<div class="panel result">
    <div class="year">${s.year}</div>
    <div class="title">${esc(s.title)}</div>
    <div class="artist">${esc(s.artist)}</div>
    <div class="verdict ${cls}">${v}</div>
    ${S.mcGuess!==false?`<div class="verdict ${S.guessed?"ok":S.mcPick==null?"neutral":"no"}">${S.guessed?"🎵 Song richtig erkannt! +1 Token":S.mcPick==null?"Kein Song getippt":"🎵 Falscher Song getippt"}</div>`:`    <div class="toggle ${S.guessed?"on":""}" onclick="S.guessed=!S.guessed;render()">
      <div class="box">${S.guessed?"✓":""}</div>
      <div style="text-align:left"><b>${esc(p.name)}</b> hat Titel <b>und</b> Interpret genannt<div class="small">${p.tokens>=MAXTOK?"Token-Maximum erreicht":"+1 Token"}${S.mode==="pro"?" · im Profi-Modus Pflicht":""}</div></div>
    </div>`}
    ${S.yearGuess!==false?`<div class="verdict ${diff===0||diff===1?"ok":"neutral"}">${diff===null?"Kein Jahrestipp":diff===0?"🎯 Volltreffer beim Jahr! +2 Tokens":diff===1?"Fast! Nur 1 Jahr daneben. +1 Token":`Jahrestipp ${diff} Jahre daneben`}</div>`:""}
    <button class="btn primary" onclick="next()">Nächster Spieler</button>
  </div>`;
}
function next(){
  const p=P(), {placeOk,chOk}=S.log;
  let gain=(S.guessed?1:0)+(S.log.diff===0?2:S.log.diff===1?1:0);
  p.tokens=Math.min(MAXTOK,p.tokens+gain);
  if(placeOk&&(S.mode==="normal"||S.guessed)) p.timeline.push(S.song);
  else if(chOk) S.players[S.ch.p].timeline.push(S.song);
  const w=S.players.findIndex(q=>q.timeline.length>=S.target);
  if(w>=0){stopMusic();S.winner=w;S.phase="win";render();return;}
  S.cur=(S.cur+1)%S.players.length; newTurn(); render(); window.scrollTo(0,0);
}
function viewWin(){
  const w=S.players[S.winner];
  return `<div class="panel" style="text-align:center"><div class="confetti">🏆</div><div class="big">${esc(w.name)} gewinnt!</div><div class="sub">${w.timeline.length} Karten in der Zeitleiste</div></div>
  ${tlPanel(w,false)}
  <button class="btn primary" onclick="rematch()">Revanche, gleiche Spieler</button>
  <button class="btn ghost" onclick="newSetup()">Neues Setup</button>`;
}
function rematch(){
  if(isBz()){S.deck=shuffle(poolIds());S.players.forEach(p=>{p.timeline=[draw()];p.tokens=S.startTokens;});bzNewSong();pushScores();return;}
  S.names=S.players.map(p=>p.name);start();}

// ---------- Modals ----------
function modal(html){$("#modal").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){$("#modal").innerHTML="";}
function askReset(){modal(`<h2>Spiel abbrechen?</h2><p class="sub">Der aktuelle Spielstand geht verloren.</p><button class="btn primary" onclick="stopMusic();const n=S.players.map(p=>p.name);S=fresh();S.names=n.length?n:['',''];closeModal();render()">Ja, neues Spiel</button><button class="btn ghost" onclick="closeModal()">Weiterspielen</button>`);}
function showRules(){modal(`<div class="rules"><h2>So funktioniert's</h2>
<p><b>Ziel:</b> Als Erste:r die vereinbarte Zahl an Songs chronologisch richtig in der eigenen Zeitleiste haben.</p>
<p><b>Start:</b> Jede:r bekommt einen aufgedeckten Song mit Jahr als Anker.</p>
<p><b>Ein Zug:</b></p><ol>
<li>Der <b>DJ</b> (die Person vor dir in der Reihenfolge) startet den Song über den grünen Button in Spotify und hält den Bildschirm verdeckt.</li>
<li>Du hörst zu und sagst, in welche Lücke deiner Zeitleiste der Song gehört. Dafür tippst du in der App auf die Lücke.</li>
<li>Andere können mit einem <b>Token</b> herausfordern und eine andere Lücke wählen. Liegst du falsch und die Herausforderin richtig, bekommt sie die Karte.</li>
<li>Beim <b>Auflösen</b> erscheinen Jahr, Titel und Interpret. Hast du Titel <b>und</b> Interpret genannt, gibt es +1 Token (maximal 5).</li></ol>
<p><b>Tokens</b> kann man auch ausgeben, um einen Song zu überspringen.</p>
<p><b>🔔 Buzzer-Modus:</b> Der Spielleiter öffnet einen Raum, alle anderen treten mit dem eigenen Handy per QR-Code bei. Läuft ein Song, darf jeder buzzern. Wer zuerst drückt, ordnet den Song auf seinem Handy in die eigene Zeitleiste ein. Liegt er falsch, kostet das einen Token und die anderen dürfen buzzern. Haben alle falsch geraten, fliegt die Karte raus.</p>
<p><b>Extras:</b> Vor dem Auflösen kannst du aus 4 Möglichkeiten den Song tippen (+1 Token) und ein exaktes Jahr schätzen (Volltreffer +2, ±1 Jahr +1 Token).</p>
<p><b>Profi-Modus:</b> Die Karte zählt nur, wenn Position und Titel + Interpret stimmen.</p>
<p><b>Gleiches Jahr:</b> Liegen zwei Songs im selben Jahr, ist jede Position direkt daneben richtig.</p>
<p class="small">Mit Spotify-Verbindung spielt die App den Song direkt auf dem gewählten Gerät ab, ein DJ ist dann nicht nötig. Ohne Verbindung öffnet Spotify die Suche. Den Treffer mit dem passenden Interpreten nehmen, möglichst die Originalversion. Wird der Song nicht gefunden, gibt es kostenlos einen neuen. Der Spielstand wird auf diesem Gerät zwischengespeichert.</p></div>
<button class="btn primary" onclick="closeModal()">Alles klar</button>`);}

if(JOIN) renderC(); else spCallback().finally(render);
</script>
</body>
</html>
